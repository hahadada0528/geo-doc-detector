{% extends "base.html" %}
{% block title %}编辑品牌 · GEO{% endblock %}
{% block lead %}修改品牌名、别名与官网域名。{% endblock %}
{% block content %}
<section class="panel full">
  <h2>编辑品牌</h2>
  <p class="hint"><a href="/collect">← 返回采集检测</a></p>
  {% if brand_message %}
  <p class="meta" style="margin-bottom:12px;color:var(--ok)">{{ brand_message }}</p>
  {% endif %}
  {% if brand %}
  <form method="post" action="/brands/{{ brand.id }}/edit">
    <div class="field">
      <label for="name">品牌名</label>
      <input id="name" name="name" required value="{{ brand.name }}" placeholder="例如：小米" />
    </div>
    <div class="field">
      <label for="aliases">别名（可选，逗号分隔）</label>
      <input id="aliases" name="aliases" value="{{ brand.aliases|join(', ') }}" placeholder="Xiaomi, MI" />
    </div>
    <div class="field">
      <label for="official_domains">已知官网域名（可选，逗号分隔）</label>
      <input id="official_domains" name="official_domains" value="{{ brand.official_domains|join(', ') }}" placeholder="mi.com, xiaomi.com" />
    </div>
    <div class="row">
      <button class="btn" type="submit">保存修改</button>
      <a class="btn secondary" href="/collect" style="text-decoration:none">取消</a>
    </div>
  </form>
  {% else %}
  <p class="meta" style="color:var(--err)">品牌不存在。</p>
  {% endif %}
</section>
{% endblock %}
